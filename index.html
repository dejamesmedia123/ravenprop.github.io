y refuse or close an account if we believe these conditions are not met."],["3. Fees and payment","Each challenge has a one-time fee shown before you pay. There are no monthly charges. Prices are set in US dollars. If you pay in another currency, we convert the price at the exchange rate shown on your quote, which may include a small markup. A quote is valid only for the time shown, and you must pay the exact amount and currency on it.<br><br>You can pay by card or bank transfer through our payment providers where offered, or by USDT (crypto) where offered. Card and bank payments are checked automatically. Crypto and manual payments are checked by our team and are not complete until we confirm them. Crypto payments cannot be reversed, so send the exact amount to the exact address and network we show. Promo codes only work as described when you enter them and may be limited, expire, or be withdrawn."],["4. Refunds","Your fee is not refundable once your trading account details have been issued to you. If you paid but we could not issue an account, or if we made a mistake, contact support and we will review a refund. We do not refund a challenge that ended because a rule was broken."],["5. Challenge rules",'Every plan lists its rules before you pay: the account size, the profit target for each phase, the daily loss limit, the maximum loss limit, and any minimum trading days, time limit or inactivity limit. The rules shown for your plan when you bought it apply to that challenge.<br><br>To pass a phase you must reach its profit target without breaking any loss limit or other rule. If you break the daily or maximum loss limit, or stay inactive for longer than the inactivity limit, the challenge ends ("breached") and you must buy a new challenge to try again. Your dashboard shows your progress, but the figures we record on our systems are the ones that count.'],["6. Fair use","You must trade in good faith. You may not: share your account or let someone else trade it; open several accounts to get around a rule; exploit platform errors, delayed prices or system faults; use another trader's signals or trades to copy their results in a way that hides who is really trading; or give us false documents or details. If we find or reasonably suspect a breach of this section, we may end your challenge, cancel your payout or reward, close your account, and keep your fee."],["7. Funded accounts and payouts","When you pass all phases you may receive a funded account. Payouts are performance rewards, and they are not guaranteed. Your payout page shows what you can request: your profit split, the maximum payout (a percentage of your account size), the minimum payout, and when you are next eligible. Requests are reviewed by our team within the time shown on the payout page. We may approve, reject with a reason, or ask for more information.<br><br>Payouts are made only to a bank account in your own name that matches your verified identity. If we pay in a currency other than US dollars, the amount is converted at the rate we show. We may pause payouts for maintenance, checks or legal reasons."],["8. Identity verification","Before your first payout we ask for your full name as it appears on your ID, and your bank account details. The name on the bank account must match your ID. We may ask for extra documents at any time to prevent fraud and to follow the law. A payout may be delayed or refused if you do not complete verification."],["9. Affiliate program","You may join our affiliate program from your account. When someone you refer buys a challenge, you may earn a commission at the rate shown in your affiliate area. Commissions are held for a set number of days, and there is a minimum withdrawal amount. You may not refer yourself, use fake sign-ups, or spam. We may reject applications, cancel or reverse commissions from refunded, fraudulent or self-referred purchases, and remove affiliates who break these rules."],["10. Your account and security","Keep
