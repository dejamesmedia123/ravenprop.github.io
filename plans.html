<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0E0A07"><title>Raven Plans</title><link rel="icon" href="favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"></head><body><div id="app"></div><div id="modal" hidden></div><div id="toasts" role="status"></div><script src="admin-common.js"></script><script>
R.init({page:"plans"},async m=>{const {$,esc,H,call,tbl,d,btn,ask,dlg,toast}=R;
const S={rows:[]},F=["fee_usd","pass_fee_usd","phase1_target","phase2_target","max_drawdown","max_drawdown_funded","payout_cap","min_payout_pct","payout_gap_days","sort_order"];
m.innerHTML=`<section class="panel"><h2>Challenge plans</h2><p class="mu sm">Edits apply to new orders straight away. Challenges already running keep working as before.</p><div id="t"></div></section>`;
async function load(){const x=await call("admin.plans.list",{});if(!x)return;S.rows=x.plans||[];$("#t").innerHTML=tbl(["Plan","Size","Fee","Targets","Max loss","Payout cap","Status",""],S.rows.map((p,i)=>`<tr><td>${esc(p.plan_id)}<div class="mu sm">${esc(p.style)}</div></td><td>$${esc(p.account_size_usd)}</td><td>$${esc(p.fee_usd)}</td><td>${esc(p.phase1_target)}% / ${esc(p.phase2_target??"-")}%</td><td>${esc(p.max_drawdown)}% / ${esc(p.max_drawdown_funded??"-")}%</td><td>${esc(p.payout_cap)}%</td><td>${esc(p.status)}</td><td>${btn("ed",i,"Edit","b1")}</td></tr>`))}
H.ed=i=>{const p=S.rows[i];dlg("Edit "+p.plan_id,F.map(k=>({k,l:k.replace(/_/g," "),v:p[k]??""})).concat([{k:"status",l:"Status",t:"sel",o:["active","inactive"],v:p.status}]),async v=>{const c={plan_id:p.plan_id};Object.keys(v).forEach(k=>{String(p[k]??"")!==v[k]&&(c[k]=k==="status"||v[k]===""?v[k]:Number(v[k]))});if(Object.keys(c).length<2)return toast("No changes");const r=await call("admin.plans.save",{plan:c},"Saved");if(r){H.cl();load()}})};
load();
});
</script></body></html>
