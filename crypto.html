<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0E0A07"><title>Raven Crypto</title><link rel="icon" href="favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"></head><body><div id="app"></div><div id="modal" hidden></div><div id="toasts" role="status"></div><script src="admin-common.js"></script><script>
R.init({page:"crypto"},async m=>{const {$,esc,H,call,tbl,d,btn,ask,dlg,toast}=R;
const S={f:"",rows:[]};
m.innerHTML=`<section class="panel"><h2>Crypto orders</h2><div class="bar"><select id="f"><option value="">Waiting for review</option><option value="all">All</option></select><button class="s" data-a="ld">Refresh</button><span class="mu sm">Refreshes every minute</span></div><div id="t"></div></section>`;
$("#f").onchange=e=>{S.f=e.target.value;load()};
async function load(){const x=await call("admin.crypto.list",S.f?{status:S.f}:{});if(!x)return;S.rows=x.orders||[];$("#t").innerHTML=tbl(["Order","Trader","Amount","TXID","Flags","Status",""],S.rows.map((o,i)=>`<tr><td>${esc(o.order_ref)}<div class="mu sm">${d(o.created_at)}</div></td><td class="sm">${esc(o.email||o.billing_email)}</td><td>${esc(o.local_amount)} USDT</td><td><code class="k" data-a="cp" data-i="${esc(o.txid)}">${esc(String(o.txid||"").slice(0,14))}…</code> ${/^https:/.test(o.explorer_url||"")?`<a href="${esc(o.explorer_url)}" target="_blank" rel="noopener">view</a>`:""}</td><td class="sm">${o.late_submission?'<span class="wn">late</span> ':""}${o.txid_reused?'<span class="bad">TXID reused</span>':""}</td><td>${esc(o.status)}</td><td>${o.status==="awaiting_confirmation"?btn("ap",i,"Approve","b1")+btn("rj",i,"Reject","x"):""}</td></tr>`))}
H.ld=load;H.ap=i=>{const o=S.rows[i];dlg("Approve "+o.order_ref,[{k:"received_usd",l:"Amount received (USDT)",v:o.local_amount},{k:"paid_at",l:"Paid at (from the explorer)",v:new Date().toISOString()},{k:"network_ok",l:"Paid on the TRC-20 network",t:"check",v:!1},{k:"chain_confirmed",l:"Confirmed on the explorer",t:"check",v:!1},{k:"accept_late",l:"Accept a late submission",t:"check",v:!!o.late_submission},{k:"note",l:"Note",v:""}],async v=>{const r=await call("admin.crypto.approve",{order_ref:o.order_ref,received_usd:Number(v.received_usd),paid_at:v.paid_at,network_ok:v.network_ok,chain_confirmed:v.chain_confirmed,accept_late:v.accept_late,note:v.note},"Approved");if(r){H.cl();load()}})};
H.rj=i=>ask("Reject order","Reason (shown to the trader)",async v=>{const r=await call("admin.crypto.reject",{order_ref:S.rows[i].order_ref,reason:v},"Rejected");if(r){load();return!0}return!1});
setInterval(load,6e4);load();
});
</script></body></html>
