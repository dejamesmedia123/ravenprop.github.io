<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0E0A07"><title>Raven Audit</title><link rel="icon" href="favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"></head><body><div id="app"></div><div id="modal" hidden></div><div id="toasts" role="status"></div><script src="admin-common.js"></script><script>
R.init({page:"audit"},async m=>{const {$,esc,H,call,tbl,d,btn,ask,dlg,toast}=R;
const S={o:0,n:50};
m.innerHTML=`<section class="panel"><h2>Audit log</h2><div class="bar"><input id="q" placeholder="Search action, ID, field or note"><input id="a" placeholder="Action starts with, e.g. promo."><button class="b1" data-a="go">Search</button><button class="s" data-a="pv">Newer</button><button class="s" data-a="nx">Older</button><span id="c" class="mu sm"></span></div><div id="t"></div></section>`;
async function load(){const x=await call("admin.audit.list",{q:$("#q").value.trim()||undefined,action:$("#a").value.trim()||undefined,limit:S.n,offset:S.o});if(!x)return;$("#c").textContent=x.total_matching+" entries, from "+(S.o+1);$("#t").innerHTML=tbl(["When","Who","Action","Item","Field","Change","Note"],(x.entries||[]).map(e=>`<tr><td>${d(e.at)}</td><td class="sm">${esc(e.actor_email)}<div class="mu">${esc(e.actor_role)}</div></td><td>${esc(e.action)}</td><td class="sm">${esc(e.entity)}<div class="mu">${esc(e.entity_id)}</div></td><td>${esc(e.field)}</td><td class="sm" style="white-space:normal;max-width:260px">${esc(e.old_value)} → ${esc(e.new_value)}</td><td class="sm">${esc(e.note)}</td></tr>`))}
H.go=()=>{S.o=0;load()};H.nx=()=>{S.o+=S.n;load()};H.pv=()=>{S.o=Math.max(0,S.o-S.n);load()};$("#q").onkeydown=e=>e.key==="Enter"&&H.go();load();
});
</script></body></html>
