<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0E0A07"><title>Raven Challenges</title><link rel="icon" href="favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"></head><body><div id="app"></div><div id="modal" hidden></div><div id="toasts" role="status"></div><script src="admin-common.js"></script><script>
R.init({page:"challenges"},async m=>{const {$,esc,H,call,tbl,d,btn,ask,dlg,toast}=R;
const S={rows:[]};
m.innerHTML=`<section class="panel"><h2>Challenges</h2><div class="bar"><input id="q" placeholder="Email, name, MT5 login or challenge ID"><select id="g"><option value="">Any stage</option><option>Phase 1</option><option>Phase 2</option><option>Funded</option></select><select id="s"><option value="">Any status</option><option>Active</option><option>Passed</option><option>Breached</option></select><button class="b1" data-a="go">Search</button></div><div id="t"></div></section><section class="panel"><h2>Breach log</h2><div id="b"></div></section>`;
$("#q").onkeydown=e=>e.key==="Enter"&&H.go();
H.go=async()=>{const q=$("#q").value.trim(),x=await call("admin.challenges.list",{q,stage:$("#g").value||undefined});if(!x)return;const s=$("#s").value;S.rows=(x.challenges||[]).filter(c=>!s||c.status===s);$("#t").innerHTML=tbl(["Challenge","Trader","Plan","Stage","Status","Created",""],S.rows.map((c,i)=>`<tr><td>${esc(c.challenge_id)}</td><td class="sm">${esc(c.email)}</td><td>${esc(c.plan_id)}</td><td>${esc(c.stage)}</td><td>${esc(c.status)}</td><td>${d(c.created_at)}</td><td>${c.status==="Active"?btn("pa",i,"Pass")+btn("br",i,"Breach","x"):c.status==="Passed"?btn("ac",i,"Assign next account","b1"):c.status==="Breached"?btn("rb",i,"Reverse breach","b1"):""}</td></tr>`));const b=await call("admin.breaches.list",{q});$("#b").innerHTML=tbl(["When","Trader","Login","Rule","Actual","Allowed","Note"],(b&&b.breaches||[]).map(o=>`<tr><td>${d(o.occurred_at)}</td><td class="sm">${esc(o.email)}</td><td>${esc(o.login)}</td><td>${esc(o.rule)}</td><td>${esc(o.actual_value)}</td><td>${esc(o.allowed_value)}</td><td class="sm">${esc(o.admin_note)}</td></tr>`))};
const rv=async(i,p)=>{const r=await call("admin.challenge.review",Object.assign({challenge_id:S.rows[i].challenge_id},p),"Done");if(r){H.go();return!0}return!1};
H.pa=i=>ask("Pass this stage","Reason",v=>rv(i,{decision:"pass",reason:v}));H.ac=i=>confirm("Assign the next account?")&&rv(i,{decision:"activate"});
H.rb=i=>dlg("Reverse breach",[{k:"reason",l:"Reason (required)",t:"area",v:""},{k:"note",l:"Internal note (optional)",v:""}],async v=>{if(!v.reason||!v.reason.trim()){toast("Reason is required",1);return!1}await rv(i,Object.assign({decision:"reverse_breach"},v))&&H.cl()});
H.br=i=>dlg("Mark breached",[{k:"rule",l:"Rule",t:"sel",o:["manual","max_loss","daily_loss","inactivity"],v:"manual"},{k:"reason",l:"Reason",t:"area",v:""},{k:"evidence",l:"Evidence (optional)",v:""}],async v=>{await rv(i,Object.assign({decision:"breach"},v))&&H.cl()});
H.go();
});
</script></body></html>
