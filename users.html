<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0E0A07"><title>Raven Users</title><link rel="icon" href="favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"></head><body><div id="app"></div><div id="modal" hidden></div><div id="toasts" role="status"></div><script src="admin-common.js"></script><script>
R.init({page:"users"},async m=>{const {$,esc,H,call,tbl,d,btn,ask,dlg,toast}=R;
const S={rows:[],u:null},sec=(t,r,c)=>`<section class="panel"><h2>${t}</h2>${tbl(c.map(x=>x.replace(/_/g," ")),r.map(o=>`<tr>${c.map(k=>`<td>${/_at$/.test(k)?d(o[k]):esc(o[k])}</td>`).join("")}</tr>`))}</section>`;
m.innerHTML=`<section class="panel"><h2>Find a trader</h2><div class="bar"><input id="q" placeholder="Email, name, phone or ID"><select id="r"><option value="">Any role</option><option>trader</option><option>admin</option><option>owner</option></select><select id="s"><option value="">Any status</option><option>active</option><option>restricted</option><option>banned</option></select><button class="b1" data-a="go">Search</button></div><div id="l"></div></section><div id="dt" style="display:grid;gap:14px"></div>`;
$("#q").onkeydown=e=>e.key==="Enter"&&H.go();
H.go=async()=>{const x=await call("admin.users.list",{q:$("#q").value.trim(),role:$("#r").value||undefined,status:$("#s").value||undefined});if(!x)return;S.rows=x.users||[];$("#l").innerHTML=tbl(["Email","Name","Role","Status","Country","Last login",""],S.rows.map((u,i)=>`<tr><td>${esc(u.email)}</td><td>${esc(u.full_name)}</td><td>${esc(u.role)}</td><td>${esc(u.status)}${u.locked?' <span class="wn">locked</span>':""}</td><td>${esc(u.country)}</td><td>${d(u.last_login_at)}</td><td>${btn("op",i,"Open","b1")}</td></tr>`))};
async function open(id){const x=await call("admin.users.list",{target_user_id:id});if(!x)return;S.u=x;const u=x.user||{};$("#dt").innerHTML=`<section class="panel"><h2>${esc(u.email)} <span class="mu sm">${esc(u.role)} · ${esc(u.status)}</span></h2><div class="sm mu">${esc(u.full_name)} · ${esc(u.phone)} · ${esc(u.country)} · ${esc(u.user_id)}</div><div class="row">${btn("us",0,"Restrict")}${btn("us",1,"Ban","x")}${btn("us",2,"Reinstate","b1")}${btn("ul",0,"Unlock login")}</div></section>`+sec("Challenges",x.challenges||[],["challenge_id","plan_id","stage","status","created_at"])+sec("Payments",x.payments||[],["order_ref","plan_id","amount_usd","gateway","status","created_at"])+sec("Payouts",x.payouts||[],["payout_id","amount_usd","status","requested_at"])+sec("KYC",x.kyc?[x.kyc]:[],["status","id_name","bank_name","bank_account_name"])+sec("Affiliate",x.affiliate?[x.affiliate]:[],["code","status","rate_pct","clicks","signups"])+sec("Tickets",x.tickets||[],["subject","status","created_at"]);$("#dt").scrollIntoView()}
H.op=i=>open(S.rows[i].user_id);
const up=async p=>{const r=await call("admin.users.update",Object.assign({target_user_id:S.u.user.user_id},p),"Done");if(r){open(S.u.user.user_id);return!0}return!1};
H.us=i=>i==2?up({status:"active"}):ask(i?"Ban user":"Restrict user","Reason",v=>up({status:i?"banned":"restricted",reason:v}));H.ul=()=>up({unlock:!0});
});
</script></body></html>
