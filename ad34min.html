<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Apex Finance – Payment Admin</title>
<style>
:root{--bg:#fff8f1;--panel:#ffffff;--line:#ffe1c8;--text:#2b1a0e;--mute:#8a6a52;--accent:#ff7a00;--accent2:#ff4d00;--ok:#188a52;--err:#d93025;--field:#fffaf5;
--grad:linear-gradient(135deg,#ff9a1f 0%,#ff6a00 55%,#ff4d00 100%);--shadow:0 10px 30px rgba(255,106,0,.12)}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:0 16px 48px;
background:var(--bg) url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABwAAAAcCAYAAAByDd+UAAAAPklEQVR42mNgGAWjYBSMglFAKWAkR9P/KgY3uAFtDLtI0ctEiWXY+FS3kFIw+C1EjzNS43AUjIJRMAqGIQAAzh8JCgMDrqUAAAAASUVORK5CYII=") repeat}
main{max-width:640px;margin:0 auto}
.hero{position:relative;margin:16px 0 18px;border-radius:20px;overflow:hidden;min-height:130px;color:#fff;box-shadow:var(--shadow);
background:url("data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 800 200%22 preserveAspectRatio=%22xMidYMid slice%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23ff8a00%22/%3E%3Cstop offset=%221%22 stop-color=%22%23ff4d00%22/%3E%3C/linearGradient%3E%3ClinearGradient id=%22w%22 x1=%220%22 y1=%220%22 x2=%220%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23fff%22 stop-opacity=%22.35%22/%3E%3Cstop offset=%221%22 stop-color=%22%23fff%22 stop-opacity=%220%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%22800%22 height=%22200%22 fill=%22url(%23g)%22/%3E%3Ccircle cx=%22700%22 cy=%2220%22 r=%22130%22 fill=%22url(%23w)%22/%3E%3Ccircle cx=%2290%22 cy=%22190%22 r=%22110%22 fill=%22url(%23w)%22/%3E%3Cpath d=%22M0 150 C150 100 300 200 450 150 S700 110 800 150 V200 H0Z%22 fill=%22%23fff%22 fill-opacity=%22.18%22/%3E%3C/svg%3E") center/cover,var(--grad)}
.hero .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.38;mix-blend-mode:multiply}
.hero .in{position:relative;padding:20px;display:flex;gap:14px;align-items:center;min-height:130px}
.hero .badge-img{width:52px;height:52px;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.hero h2{margin:0;font-size:1.35rem;text-shadow:0 2px 8px rgba(0,0,0,.18)}
.hero p{margin:2px 0 0;font-size:.9rem;opacity:.95}
h1{font-size:1.4rem;margin:8px 0 14px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--text);font-size:1rem}
button{padding:12px 16px;border:0;border-radius:10px;background:var(--grad);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 5px 14px rgba(255,106,0,.3)}
button.ghost{background:#fff;color:var(--accent2);border:1px solid var(--accent);box-shadow:none}
button.ok{background:linear-gradient(135deg,#2bb673,#188a52);color:#fff;box-shadow:none}
button.no{background:linear-gradient(135deg,#ef5350,#d93025);color:#fff;box-shadow:none}
button:disabled{opacity:.5}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);position:relative}
.card::before{content:"";position:absolute;left:16px;right:16px;top:0;height:3px;border-radius:0 0 4px 4px;background:var(--grad)}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.tabs{display:flex;gap:8px}
.tabs button{padding:8px 14px}
.tabs button.on{background:var(--grad);color:#fff}
.meta{color:var(--mute);font-size:.85rem}
.row{display:flex;justify-content:space-between;gap:12px;margin:4px 0;font-size:.92rem}
.row span:first-child{color:var(--mute)}
.row b{text-align:right;word-break:break-all}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:700}
.Pending{background:#fff0dd;color:#c25a00}.Approved{background:#e3f6ec;color:var(--ok)}.Rejected{background:#fdeaea;color:var(--err)}
.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1}
.err{color:var(--err);min-height:1.2em;margin:8px 0}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <header class="hero">
    <img class="photo" alt="" src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1000&q=70" onerror="this.style.display='none'">

      <div><h2>Apex Finance</h2><p>Payment admin</p></div>
    </div>
  </header>

  <section id="login" class="card">
    <h1>Admin login</h1>
    <input id="key" type="password" placeholder="Admin key" autocomplete="current-password">
    <div class="err" id="loginErr" role="alert"></div>
    <button id="loginBtn" style="width:100%">Sign in</button>
  </section>

  <section id="panel" class="hidden">
    <h1>Hosting payments</h1>
    <div class="top">
      <div class="tabs"><button id="tPending" class="on">Pending</button><button id="tAll" class="ghost">All</button></div>
      <div><button class="ghost" id="refresh">Refresh</button> <button class="ghost" id="logout">Log out</button></div>
    </div>
    <div class="err" id="err" role="alert"></div>
    <div id="list"></div>
  </section>
</main>

<script>
/* ======== EDIT THIS ======== */
const GAS_URL = "https://script.google.com/macros/s/AKfycbw0nZlZe4niACI6IWksMo3eJRkMfcO9IifoN5_E5v4MBbIbDJUdBZX582AvE999o6jXYA/exec"; // same /exec URL as the payment form
/* =========================== */

const $ = id => document.getElementById(id);
let KEY = sessionStorage.getItem("apexAdminKey") || "";
let orders = [], filter = "Pending", pollId;

async function api(body){
  const r = await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,key:KEY})});
  return r.json();
}
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function load(){
  $("err").textContent="";
  try{
    const d = await api({action:"list"});
    if(!d.ok){ if(/key/i.test(d.error||"")) return logout(); throw new Error(d.error); }
    orders = d.orders; render();
  }catch(e){ $("err").textContent="Could not load payments. Check your connection and try again."; }
}

function render(){
  const shown = orders.filter(o=>filter==="All"||o.status===filter);
  $("tPending").className = filter==="Pending"?"on":"ghost"; $("tAll").className = filter==="All"?"on":"ghost";
  $("list").innerHTML = shown.length ? shown.map(o=>`
    <div class="card">
      <div class="row"><b>${esc(o.name)}</b><span class="badge ${esc(o.status)}">${esc(o.status)}</span></div>
      <div class="meta">${esc(o.email)} · ${new Date(o.at).toLocaleString()}</div>
      <div class="row"><span>Order</span><b>${esc(o.id)}</b></div>
      <div class="row"><span>Due</span><b>${esc(o.cycle)}</b></div>
      <div class="row"><span>Amount</span><b>${esc(o.amount)} USDT (${esc(o.network)})</b></div>
      <div class="row"><span>Sent to</span><b>${esc((o.wallet||"").slice(0,6))}…${esc((o.wallet||"").slice(-4))}</b></div>
      ${o.status==="Pending"?`<div class="actions"><button class="ok" data-a="approve" data-id="${esc(o.id)}">Approve</button><button class="no" data-a="reject" data-id="${esc(o.id)}">Reject</button></div>`:""}
    </div>`).join("") : '<div class="card meta">No '+(filter==="Pending"?"pending ":"")+'payments.</div>';
}

$("list").addEventListener("click", async e=>{
  const b=e.target.closest("button[data-a]"); if(!b) return;
  if(b.dataset.a==="reject" && !confirm("Reject this payment?")) return;
  b.disabled=true;
  try{
    const d=await api({action:b.dataset.a,id:b.dataset.id});
    if(!d.ok) throw new Error(d.error);
    await load();
  }catch(err){ $("err").textContent=err.message||"Action failed."; b.disabled=false; }
});

function enter(){ $("login").classList.add("hidden"); $("panel").classList.remove("hidden"); load(); clearInterval(pollId); pollId=setInterval(load,30000); }
function logout(){ sessionStorage.removeItem("apexAdminKey"); KEY=""; clearInterval(pollId); $("panel").classList.add("hidden"); $("login").classList.remove("hidden"); $("loginErr").textContent="Wrong or expired admin key."; }

$("loginBtn").onclick=async()=>{
  KEY=$("key").value.trim(); $("loginErr").textContent="";
  if(!KEY) return;
  $("loginBtn").disabled=true;
  try{
    const d=await api({action:"list"});
    if(!d.ok) throw new Error(d.error||"Wrong admin key.");
    sessionStorage.setItem("apexAdminKey",KEY); orders=d.orders; enter();
  }catch(e){ $("loginErr").textContent=e.message; }
  $("loginBtn").disabled=false;
};
$("key").addEventListener("keydown",e=>{ if(e.key==="Enter") $("loginBtn").click(); });
$("tPending").onclick=()=>{filter="Pending";render();}; $("tAll").onclick=()=>{filter="All";render();};
$("refresh").onclick=load;
$("logout").onclick=()=>{ logout(); $("loginErr").textContent=""; };

if(KEY) enter();
</script>
</body>
</html>
