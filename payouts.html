<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0E0A07"><title>Raven Payouts</title><link rel="icon" href="favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"></head><body><div id="app"></div><div id="modal" hidden></div><div id="toasts" role="status"></div><script src="admin-common.js"></script><script>
R.init({page:"payouts"},async m=>{const {$,esc,H,call,tbl,d,btn,ask,dlg,toast}=R;
const S={st:"Submitted",rows:[],kq:[]},A={"Submitted":[["rv","Review"],["ap","Approve","b1"],["rj","Reject","x"]],"Under Review":[["ap","Approve","b1"],["rj","Reject","x"]],"Approved":[["pd","Mark paid","b1"],["rj","Reject","x"]]};
m.innerHTML=`<section class="panel"><h2>Payout requests</h2><div class="bar"><select id="f">${["Submitted","Under Review","Approved","Paid","Rejected",""].map(s=>`<option value="${s}">${s||"All"}</option>`).join("")}</select><span id="cn" class="mu sm"></span></div><div id="t"></div></section><section class="panel"><h2>KYC waiting for review</h2><div id="k"></div></section>`;
$("#f").onchange=e=>{S.st=e.target.value;load()};
async function load(){const x=await call("admin.payouts.list",{status:S.st||undefined});if(!x)return;S.rows=x.payouts||[];$("#cn").textContent=Object.entries(x.counts||{}).map(e=>e.join(": ")).join(" · ");
$("#t").innerHTML=tbl(["Requested","Trader","Amount","Local","Bank","KYC","Status",""],S.rows.map((p,i)=>`<tr><td>${d(p.requested_at)}</td><td>${esc(p.user_name)}<div class="mu sm">${esc(p.user_email)}</div></td><td>$${esc(p.amount_usd)}</td><td class="sm">${esc(p.currency)} ${esc(p.local_amount)}</td><td class="sm">${esc(p.bank_name)}<div><code class="k" data-a="cp" data-i="${esc(p.bank_account_number)}">${esc(p.bank_account_number)}</code></div><div class="mu">${esc(p.bank_account_name)}</div></td><td>${R.pill(p.kyc_status==="Verified"?"Yes":"No")}</td><td>${esc(p.status)}${p.reject_reason?`<div class="mu sm">${esc(p.reject_reason)}</div>`:""}</td><td>${(A[p.status]||[]).map(a=>btn(a[0],i,a[1],a[2])).join("")}</td></tr>`));
const k=await call("admin.kyc.review",{});S.kq=k&&k.queue||[];$("#k").innerHTML=tbl(["Trader","ID name","Bank account name","Account","Names match",""],S.kq.map((q,i)=>`<tr><td class="sm">${esc(q.full_name)}<div class="mu">${esc(q.email)}</div></td><td>${esc(q.id_name)}</td><td>${esc(q.bank_account_name)}</td><td class="sm">${esc(q.bank_name)} ${esc(q.bank_account_number)}</td><td>${R.pill(q.names_match?"Yes":"No")}</td><td>${btn("kv",i,"Verify","b1")}${btn("kf",i,"Needs fix","x")}</td></tr>`))}
const mv=async(a,i,x)=>{const r=await call("admin.payout."+a,Object.assign({payout_id:S.rows[i].payout_id},x),"Done");if(r){load();return!0}return!1};
H.rv=i=>mv("review",i);H.ap=i=>confirm("Approve this payout?")&&mv("approve",i);H.rj=i=>ask("Reject payout","Reason (shown to the trader)",v=>mv("reject",i,{reason:v}));H.pd=i=>ask("Mark paid","Transfer reference",v=>mv("markPaid",i,{reference:v}));
H.kv=async i=>{await call("admin.kyc.review",{kyc_id:S.kq[i].kyc_id,decision:"verify"},"Verified")&&load()};H.kf=i=>ask("Needs fix","What should the trader fix?",async v=>{const r=await call("admin.kyc.review",{kyc_id:S.kq[i].kyc_id,decision:"action_required",note:v,admin_note:v},"Sent");if(r){load();return!0}return!1});
load();
});
</script></body></html>
