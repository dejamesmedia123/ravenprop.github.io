<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0E0A07"><title>Raven Affiliates</title><link rel="icon" href="favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"></head><body><div id="app"></div><div id="modal" hidden></div><div id="toasts" role="status"></div><script src="admin-common.js"></script><script>
R.init({page:"affiliates"},async m=>{const {$,esc,H,call,tbl,d,btn,ask,dlg,toast}=R;
const S={rows:[],w:[]};
m.innerHTML=`<section class="panel"><h2>Withdrawals waiting</h2><div id="w"></div></section><section class="panel"><h2>Affiliates</h2><div class="bar"><select id="f">${["","pending","active","suspended","rejected"].map(s=>`<option value="${s}">${s||"All"}</option>`).join("")}</select><label class="chk"><input type="checkbox" id="fl"> Flagged only</label><button class="s" data-a="cb">Clawback a sale</button></div><div id="t"></div></section>`;
$("#f").onchange=$("#fl").onchange=()=>load();
async function load(){const x=await call("admin.affiliates.list",{status:$("#f").value||undefined,flagged:$("#fl").checked||undefined});if(!x)return;S.rows=x.affiliates||[];S.w=x.open_withdrawals||[];
$("#w").innerHTML=tbl(["Requested","Affiliate","Amount","Status",""],S.w.map((a,i)=>`<tr><td>${d(a.created_at)}</td><td class="sm">${esc(a.email||a.full_name||a.affiliate_id)}</td><td>$${esc(a.amount_usd??a.amount)}</td><td>${esc(a.status)}</td><td>${a.status==="requested"?btn("wa",i,"Approve","b1")+btn("wr",i,"Reject","x"):btn("wp",i,"Mark paid","b1")}</td></tr>`));
const B={pending:[["ap","Approve","b1"],["rj","Reject","x"]],active:[["sp","Suspend","x"],["fz","Freeze"],["uf","Unfreeze"],["aj","Adjust"]],suspended:[["ri","Reinstate","b1"]]};
$("#t").innerHTML=tbl(["Code","Affiliate","Status","Rate","Clicks","Signups","Sales","Flags",""],S.rows.map((a,i)=>`<tr><td>${esc(a.code)}</td><td class="sm">${esc(a.full_name)}<div class="mu">${esc(a.email)}</div></td><td>${esc(a.status)}</td><td>${esc(a.rate_pct??a.effective_rate_pct)}%</td><td>${esc(a.clicks)}</td><td>${esc(a.signups)}</td><td>${esc(a.purchases)}</td><td class="sm">${a.frozen?'<span class="wn">frozen</span> ':""}${a.flagged?`<span class="bad">flagged</span> ${esc(a.flag_reason)}`:""}</td><td>${(B[a.status]||[]).map(b=>btn(b[0],i,b[1],b[2])).join("")}${a.flagged?btn("cf",i,"Clear flag"):""}</td></tr>`))}
const up=async(i,p)=>{const r=await call("admin.affiliates.update",Object.assign({affiliate_id:S.rows[i].affiliate_id},p),"Done");if(r){load();return!0}return!1},wd=async(i,p)=>{const r=await call("admin.affiliates.withdrawal",Object.assign({txn_id:S.w[i].txn_id},p),"Done");if(r){load();return!0}return!1};
H.ap=i=>up(i,{decision:"approve"});H.rj=i=>ask("Reject application","Reason",v=>up(i,{decision:"reject",reason:v}));H.sp=i=>ask("Suspend affiliate","Reason",v=>up(i,{decision:"suspend",reason:v}));H.ri=i=>up(i,{decision:"reinstate"});H.fz=i=>up(i,{decision:"freeze"});H.uf=i=>up(i,{decision:"unfreeze"});H.cf=i=>up(i,{decision:"clear_flag"});
H.aj=i=>dlg("Adjust balance",[{k:"amount_usd",l:"Amount in USD (negative to debit)",v:""},{k:"reason",l:"Reason",t:"area",v:""}],async v=>{const r=await call("admin.affiliates.adjust",{affiliate_id:S.rows[i].affiliate_id,amount_usd:v.amount_usd,reason:v.reason},"Adjusted");if(r){H.cl();load()}});
H.wa=i=>wd(i,{decision:"approve"});H.wr=i=>ask("Reject withdrawal","Reason",v=>wd(i,{decision:"reject",reason:v}));H.wp=i=>ask("Mark paid","Transfer reference",v=>wd(i,{decision:"paid",reference:v}));
H.cb=()=>dlg("Clawback a sale",[{k:"order_ref",l:"Order reference",v:""},{k:"reason",l:"Reason",t:"area",v:""}],async v=>{const r=await call("admin.affiliates.clawback",v,"Done");if(r){H.cl();load()}});
load();
});
</script></body></html>
